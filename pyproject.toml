[project]
name = "ecurie-workspace"
version = "0.1.0"
description = "Racine du workspace Écurie — voir ARCHITECTURE.md"
requires-python = ">=3.12"
dependencies = ["ecurie-core"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ecurie-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests"]
markers = ["real: tests d'intégration sur le vrai parc, hors CI"]
addopts = "-m 'not real'"
