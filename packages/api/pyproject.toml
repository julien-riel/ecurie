[project]
name = "ecurie-api"
version = "0.4.0"
description = "Écurie — API HTTP : registre, parc, résidents, jobs"
requires-python = ">=3.12"
dependencies = [
    "ecurie-core",
    "ecurie-store",
    "ecurie-runtime",
    "fastapi>=0.115",
    # `/uploads` reçoit du multipart/form-data. Starlette délègue son analyse à
    # ce paquet et ne le déclare pas : sans lui, la route lève à l'import avec
    # « Form data requires python-multipart » — une panne au démarrage, pas à la
    # requête. C'est la même famille de manque que le jinja2 de l'env mlx-audio.
    "python-multipart>=0.0.18",
    "uvicorn>=0.30",
    "typer>=0.12",
    "rich>=13",
]

[tool.uv.sources]
ecurie-core = { workspace = true }
ecurie-store = { workspace = true }
ecurie-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecurie_api"]
