[project]
name = "ecurie-core"
version = "0.1.0"
description = "Écurie — schémas, résolveur, chargement du registre, CLI"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6",
    "jsonschema>=4.23",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
ecurie = "ecurie_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecurie_core"]
