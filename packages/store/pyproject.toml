[project]
name = "ecurie-store"
version = "0.3.0"
description = "Écurie — scan disque, comptabilité, dédup, GC, tiering"
requires-python = ">=3.12"
dependencies = [
    "ecurie-core",
    "huggingface_hub>=0.26",
    "typer>=0.12",
    "rich>=13",
]

[tool.uv.sources]
ecurie-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecurie_store"]
