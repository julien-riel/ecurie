[project]
name = "ecurie-runtime"
version = "0.3.0"
description = "Écurie — workers, environnements isolés, contrôle d'admission mémoire"
requires-python = ">=3.12"
dependencies = [
    "ecurie-core",
    "ecurie-store",
    "typer>=0.12",
    "rich>=13",
]

[tool.uv.sources]
ecurie-core = { workspace = true }
ecurie-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecurie_runtime"]
