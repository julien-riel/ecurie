# Tête parlante — SoulX-FlashHead 1.3B, variante Pro, portage MLX.
id: soulx-flashhead
name: SoulX-FlashHead Pro
capability: talking-head
family: flashhead
vendor: Soul AI Lab (Soul-AILab)
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Candidat pour un présentateur à l'écran dans les films de formation, à la place de
  MuseTalk dont la tête restait immobile sur une image fixe. Un DiT Wan 2.1 de 1,3
  milliard de paramètres, distillé en quatre pas, conditionné par wav2vec2 :
  portrait et parole en entrée, vidéo 512×512 à 25 im/s en sortie, par tronçons de
  33 images.

  **Seule la variante Pro est au registre, pour une raison de licence.** La variante
  Lite embarque le VAE de LTX-Video 0.9, dont la licence (« RAIL-M License dated
  November 22, 2024 », fichier ltx-video-2b-v0.9.license.txt de Lightricks) réserve
  l'usage à « academic or research purposes only ». La fiche amont l'écrit elle-même :
  « If you only use Pro variant (VAE_WAN), the whole workflow is under Apache-2.0 ».
  Pro, c'est le DiT (Apache-2.0), le VAE Wan 2.1 (Apache-2.0) et
  wav2vec2-base-960h (Apache-2.0).

  La fiche amont est passée de `license: apache-2.0` à `license: other` le
  2026-10-09, pour détailler ces composants. Une confirmation écrite de l'usage
  commercial a été demandée à l'éditeur (issue #86 du dépôt GitHub, 2026-11-14), sans
  réponse au 2026-11-17. Le jeu d'entraînement, VividHead (782 h selon le papier),
  n'a pas de licence publiée.

  Les poids sont la conversion MLX d'Avdpro (AI2Apps), sans le VAE LTX, depuis la
  révision amont 59119b6c68. Le code du portage est vendoré par
  `runtimes/mlx-flashhead/vendorer.py`. Le cadrage passe par Apple Vision, pas par
  MediaPipe.

