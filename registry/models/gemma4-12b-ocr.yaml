# Gemma 4 12B — lecture de document. Voir gemma4-12b-texte.yaml pour l'en-tête
# de la famille.
#
# C'est la capacité que la fiche amont documente le plus précisément : documents
# et PDF, interfaces d'écran, graphiques, OCR multilingue et écriture
# manuscrite. Cette dernière est la seule des quatre à ne pas être couverte par
# le titulaire — le golden set de la capacité n'a pas de cas manuscrit, et il en
# faudrait un pour que la comparaison veuille dire quelque chose.
id: gemma4-12b-ocr
name: Gemma 4 12B Instruct (lecture de document)
capability: document-to-text
family: gemma4
vendor: Google
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Challenger de qwen3-vl-8b-ocr. Le profil doit être mesuré pour lui-même :
  transcrire une page et décrire une photo ne produisent pas le même nombre de
  jetons, donc pas le même pic ni la même durée, et un profil recopié d'un
  manifeste à l'autre serait exactement l'estimation à la main que le projet
  s'interdit.

links:
  homepage: https://huggingface.co/google/gemma-4-12B-it

