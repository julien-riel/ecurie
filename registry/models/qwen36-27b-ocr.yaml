# Lecture de document — les MÊMES poids que qwen36-27b-describe, autre contrat.
#
# La fiche amont donne 81,0 à CC-OCR et 79,5 à CharXiv RQ, ce qui situe le modèle
# sur cette capacité sans rien dire de ce qu'il vaut face à qwen3-vl-8b-ocr, qui
# n'apparaît dans aucune de ses tables. Le gain reste donc inconnu, et le restera
# jusqu'au golden set.
#
# Comme les trois autres manifestes de la famille, celui-ci décrit un modèle qui
# ne tient pas dans le budget mémoire de la machine cible : voir l'en-tête de
# qwen36-27b-describe pour le calcul, et le rapport de veille du 2026-08-23 pour
# ce qu'il faudrait pour le débloquer.
id: qwen36-27b-ocr
name: Qwen3.6 27B (lecture de document)
capability: document-to-text
family: qwen3.6
vendor: Alibaba Qwen
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Aucun téléchargement propre : ce manifeste désigne les dépôts et révisions de
  qwen36-27b-describe. Le profil, lui, devra être mesuré pour lui-même —
  transcrire une page et décrire une photo ne produisent ni le même nombre de
  jetons ni le même pic, et un profil recopié d'un manifeste à l'autre serait
  exactement l'estimation à la main que le projet s'interdit.

links:
  homepage: https://huggingface.co/Qwen/Qwen3.6-27B

variants:
  - id: mxfp4
    quantization: 4bit
    tier: absent
    runtime: mlx-vlm
    source:
      kind: huggingface
      repo: mlx-community/Qwen3.6-27B-mxfp4
      revision: "b4ac73652af626fd653d0e4fe48a4e9c468a82f6"   # 2026-04-22
      allow_patterns: ["*.json", "*.safetensors", "*.txt", "*.jinja"]
    defaults:
      format: markdown
      detect_layout: true
      dpi: 200
    caveats:
      - "15,2 Go de poids pour un budget GPU praticable de 15 à 17 Go : le pic estimé (17,4 à 19,2 Go) dépasse le plafond."
      - "Le mode « thinking » est actif par défaut : la transcription rendue sera précédée d'un bloc <think>…</think> qu'aucun adaptateur du parc ne sait supprimer. Sur une capacité dont la sortie se compare au texte attendu, ce préambule fausse la mesure autant qu'il gêne la lecture."
      - "Un VLM transcrit, il ne localise pas : la sortie `layout` décrit les pages, pas des boîtes."
      - "Poids partagés avec qwen36-27b-describe, -detect et -video — les déporter déplace les quatre."
  - id: 4bit
    quantization: 4bit
    tier: absent
    runtime: mlx-vlm
    source:
      kind: huggingface
      repo: mlx-community/Qwen3.6-27B-4bit
      revision: "c000ac2c2057d94be3fa931000c31723aac53282"   # 2026-04-22
      allow_patterns: ["*.json", "*.safetensors", "*.txt", "*.jinja"]
    defaults:
      format: markdown
      detect_layout: true
      dpi: 200
    caveats:
      - "16,1 Go de poids : pic estimé entre 18,3 et 20,3 Go. Dominé par le variant mxfp4."
      - "Le mode « thinking » est actif par défaut et aucun adaptateur ne sait le désactiver."
