# Gemma 4 12B — génération de texte, et le manifeste qui porte l'en-tête de la
# famille : les six autres y renvoient.
#
# Ce que Gemma 4 apporte que Qwen3.6-27B n'apportait pas : **il tient**. 6,77 Go
# de poids en 4 bits contre 16,08, sur une machine dont le budget Metal est de
# 17,76 Gio. Qwen3.6-27B y entre avec 316 Mio de marge — moins de 2 % — et
# interdit tout autre résident ; Gemma 4 12B laisse la moitié du budget libre,
# donc il cohabite. Sur un parc où la politique n'admet qu'un modèle lourd à la
# fois, c'est la différence entre un modèle qu'on charge et un modèle qu'on
# utilise.
#
# Architecture `gemma4_unified` : encodeur-libre, les modalités sont projetées
# directement dans l'espace du modèle de langue. mlx-vlm 0.6.15 la porte
# (`models/gemma4_unified/`), comme il porte `gemma4` et `gemma4_text`.
#
# **L'audio de ce modèle est hors d'atteinte, et ce n'est plus l'adaptateur qui
# manque.** Gemma 4 transcrit la parole en amont, et sa configuration porte un
# `audio_config`. L'adaptateur `mlx_vlm_audio` a été écrit depuis, et il charge
# ces poids sans broncher — mais le modèle répond « je ne peux pas écouter de
# fichiers audio », et l'index des poids dit pourquoi : la conversion MLX ne
# contient que la **projection** audio (`embed_audio.embedding_projection`, trois
# tenseurs), sans l'encodeur qui la précède. Il n'y a pas de tour audio à
# charger. Le déclencheur n'est donc pas un adaptateur mais une conversion
# complète, ou le modèle amont en Torch.
id: gemma4-12b-texte
name: Gemma 4 12B Instruct (génération de texte)
capability: text-generation
family: gemma4
vendor: Google
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Apache-2.0, ce qui n'allait pas de soi : les Gemma antérieurs étaient publiés
  sous une licence maison à conditions d'usage, que le score de veille classait
  `restricted`. Celui-ci est permissif au sens SPDX, sans clause d'usage
  acceptable à relire avant chaque emploi professionnel.

  11,95 milliards de paramètres, 256 000 jetons de contexte, 35 langues
  déclarées et plus de 140 vues au pré-entraînement.

links:
  homepage: https://huggingface.co/google/gemma-4-12B-it

variants:
  - id: 4bit
    quantization: 4bit
    tier: hot
    runtime: mlx-vlm
    source:
      kind: huggingface
      repo: mlx-community/gemma-4-12B-it-4bit
      revision: "73bcf09092aa277861d5a191b989b666f7f32e8f"   # 2026-06-08
      allow_patterns: ["*.json", "*.safetensors", "*.txt", "*.jinja"]
    defaults:
      temperature: 0.7
      top_p: 0.95
      max_tokens: 1024
    options:
      # Même raison que chez Qwen3.6 : le gabarit de Gemma 4 lit
      # `enable_thinking`, et un brouillon de raisonnement consommerait le
      # budget de jetons de la réponse avant qu'elle ne commence.
      thinking: false
    caveats:
      - "6,69 Gio de pic pour un budget de 17,76 : il reste 11 Gio libres. Sous le seuil de lourdeur de 8 Gio, donc il ne monopolise pas la place réservée au modèle lourd du parc et cohabite avec un autre résident."
      - "Le raisonnement à voix haute est coupé. Le rallumer avec `thinking: true` change ce que la capacité mesure."
      - "Poids partagés avec les six autres manifestes gemma4-12b — les déporter avec `ecurie store tier` déplace les sept."
