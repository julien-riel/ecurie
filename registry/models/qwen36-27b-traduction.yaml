# Traduction — sixième emploi des mêmes poids.
#
# C'est la capacité où le mode « thinking » de Qwen3.6 aurait fait le plus de
# dégâts silencieux : une traduction se compare au caractère près à sa
# référence, et un brouillon de raisonnement placé devant elle ferait chuter la
# note d'un modèle qui a pourtant traduit juste. L'adaptateur le coupe à la
# racine plutôt que de le retirer après coup — les jetons du brouillon sont
# facturés au budget de la réponse.
id: qwen36-27b-traduction
name: Qwen3.6 27B (traduction)
capability: translation
family: qwen3.6
vendor: Alibaba Qwen
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Challenger de qwen3-4b-traduction, sept fois plus léger. Le contrat expose une
  langue d'arrivée libre, ce qu'un modèle généraliste honore et qu'un moteur NMT
  dédié ne fait pas ; à ce jeu, la taille joue en faveur de ce candidat sur les
  langues peu servies. Reste à savoir si l'écart justifie de vider le parc.

links:
  homepage: https://huggingface.co/Qwen/Qwen3.6-27B

