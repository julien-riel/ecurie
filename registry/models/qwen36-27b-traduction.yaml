# Traduction — sixième emploi des mêmes poids.
#
# C'est la capacité où le mode « thinking » de Qwen3.6 aurait fait le plus de
# dégâts silencieux : une traduction se compare au caractère près à sa
# référence, et un brouillon de raisonnement placé devant elle ferait chuter la
# note d'un modèle qui a pourtant traduit juste. L'adaptateur le coupe à la
# racine plutôt que de le retirer après coup — les jetons du brouillon sont
# facturés au budget de la réponse.
id: qwen36-27b-traduction
name: Qwen3.6 27B (traduction)
capability: translation
family: qwen3.6
vendor: Alibaba Qwen
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Challenger de qwen3-4b-traduction, sept fois plus léger. Le contrat expose une
  langue d'arrivée libre, ce qu'un modèle généraliste honore et qu'un moteur NMT
  dédié ne fait pas ; à ce jeu, la taille joue en faveur de ce candidat sur les
  langues peu servies. Reste à savoir si l'écart justifie de vider le parc.

links:
  homepage: https://huggingface.co/Qwen/Qwen3.6-27B

variants:
  - id: 4bit
    quantization: 4bit
    tier: hot
    runtime: mlx-vlm
    source:
      kind: huggingface
      repo: mlx-community/Qwen3.6-27B-4bit
      revision: "c000ac2c2057d94be3fa931000c31723aac53282"   # 2026-04-22
      allow_patterns: ["*.json", "*.safetensors", "*.txt", "*.jinja"]
    defaults:
      register: neutre
      preserve_formatting: true
    options:
      thinking: false
    caveats:
      - "16,1 Go de poids : le pic dépasse le budget de la machine cible. Ne démarre qu'avec --hors-budget, parc vidé."
      - "Ne détecte pas la langue de départ : il traduit ce qu'on lui donne. `detected_source_language` rend la langue déclarée, ou rien."
      - "Poids partagés avec les six autres manifestes qwen36-27b — les déporter déplace les sept."
  - id: mxfp4
    quantization: 4bit
    tier: absent
    runtime: mlx-vlm
    source:
      kind: huggingface
      repo: mlx-community/Qwen3.6-27B-mxfp4
      revision: "b4ac73652af626fd653d0e4fe48a4e9c468a82f6"   # 2026-04-22
      allow_patterns: ["*.json", "*.safetensors", "*.txt", "*.jinja"]
    defaults:
      register: neutre
      preserve_formatting: true
    options:
      thinking: false
    caveats:
      - "840 Mo de moins que le variant 4bit. Non téléchargé."
