# Appel d'outils — septième et dernier emploi des mêmes poids.
#
# Celui-ci a demandé plus qu'un aiguillage. Qwen3.6 ne rend pas ses appels en
# JSON balisé comme Qwen3, mais en XML imbriqué :
#
#     <tool_call><function=météo><parameter=ville>Paris</parameter></function></tool_call>
#
# L'extracteur de `mlx_lm_tools` capturait bien la balise, tentait un
# `json.loads` sur son contenu, échouait, et rendait zéro appel — sur un modèle
# qui avait choisi le bon outil et rempli le bon argument. Il a gagné une
# stratégie `xml_function`, et la métrique `parse_strategy` du job dit désormais
# lequel des trois formats a servi.
#
# Écurie n'exécute toujours aucun outil : elle juge le choix et le remplissage.
id: qwen36-27b-outils
name: Qwen3.6 27B (appel d'outils)
capability: tool-use
family: qwen3.6
vendor: Alibaba Qwen
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Challenger de qwen3-4b-outils. La métrique `template_tools` doit rester vraie
  d'une exécution à l'autre : le gabarit de Qwen3.6 accepte `tools`, donc l'appel
  est natif et non un repli par consigne système. Si elle passe à faux après une
  mise à jour du gabarit, la comparaison avec les mesures antérieures cesse
  d'être valide, et il vaut mieux l'apprendre là que par un score qui baisse
  sans raison.

links:
  homepage: https://huggingface.co/Qwen/Qwen3.6-27B

variants:
  - id: 4bit
    quantization: 4bit
    tier: hot
    runtime: mlx-vlm
    source:
      kind: huggingface
      repo: mlx-community/Qwen3.6-27B-4bit
      revision: "c000ac2c2057d94be3fa931000c31723aac53282"   # 2026-04-22
      allow_patterns: ["*.json", "*.safetensors", "*.txt", "*.jinja"]
    defaults:
      tool_choice: auto
      parallel_calls: false
      temperature: 0.0
    options:
      thinking: false
    caveats:
      - "16,1 Go de poids : le pic dépasse le budget de la machine cible. Ne démarre qu'avec --hors-budget, parc vidé."
      - "Format d'appel XML et non JSON : la métrique `parse_strategy` doit rendre `xml_function`. Si elle rend `aucun`, c'est l'extracteur qu'il faut regarder avant d'accuser le modèle."
      - "Poids partagés avec les six autres manifestes qwen36-27b — les déporter déplace les sept."
  - id: mxfp4
    quantization: 4bit
    tier: absent
    runtime: mlx-vlm
    source:
      kind: huggingface
      repo: mlx-community/Qwen3.6-27B-mxfp4
      revision: "b4ac73652af626fd653d0e4fe48a4e9c468a82f6"   # 2026-04-22
      allow_patterns: ["*.json", "*.safetensors", "*.txt", "*.jinja"]
    defaults:
      tool_choice: auto
      parallel_calls: false
      temperature: 0.0
    options:
      thinking: false
    caveats:
      - "840 Mo de moins que le variant 4bit. Non téléchargé."
