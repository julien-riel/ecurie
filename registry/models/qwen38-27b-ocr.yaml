# Lecture de document — les MÊMES poids que qwen38-27b-describe, autre contrat.
#
# Aucun téléchargement propre : ce manifeste désigne le dépôt et la révision de
# qwen38-27b-describe, dont l'en-tête porte le raisonnement de la famille. Le
# profil, lui, est mesuré pour lui-même — transcrire une page et décrire une
# photo ne produisent ni le même nombre de jetons ni le même pic, et sur ce
# gabarit l'écart entre les deux se compte en centaines de mébioctets contre une
# marge qui en fait quelques centaines.
