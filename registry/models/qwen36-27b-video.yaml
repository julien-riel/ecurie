# Description de vidéo — quatrième emploi des mêmes poids, et le plus coûteux
# en mémoire des quatre.
#
# Le titulaire qwen3-vl-8b-video est mesuré à 1,26 fois son poids sur disque,
# contre 1,14 pour la description d'image : les images empilées d'une vidéo sont
# ce qui pousse le pic le plus haut. C'est donc sur cette capacité que le
# dépassement de budget est le plus franc — 19,2 Go estimés pour le variant le
# plus léger, contre un plafond de 17.
#
# Le modèle porte un `video_token_id` et un mRoPE à section temporelle, donc un
# chemin vidéo natif. Reste à savoir s'il est utilisable : sur les poids du
# titulaire, ce chemin s'est révélé cassé — il transmettait un unique jeton de
# remplissage, et l'adaptateur décode les images lui-même depuis. Rien ne dit
# que Qwen3.6 se comporte pareil, et rien ne dit le contraire.
id: qwen36-27b-video
name: Qwen3.6 27B (description de vidéo)
capability: video-to-text
family: qwen3.6
vendor: Alibaba Qwen
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Challenger de qwen3-vl-8b-video. Comme les trois autres manifestes de la
  famille, il décrit un modèle dont le pic estimé dépasse le budget de la
  machine cible : voir l'en-tête de qwen36-27b-describe pour le calcul.

links:
  homepage: https://huggingface.co/Qwen/Qwen3.6-27B

variants:
  - id: mxfp4
    quantization: 4bit
    tier: absent
    runtime: mlx-vlm
    source:
      kind: huggingface
      repo: mlx-community/Qwen3.6-27B-mxfp4
      revision: "b4ac73652af626fd653d0e4fe48a4e9c468a82f6"   # 2026-04-22
      allow_patterns: ["*.json", "*.safetensors", "*.txt", "*.jinja"]
    defaults:
      fps: 1.0
      max_frames: 8
      max_tokens: 512
      temperature: 0.2
    caveats:
      - "840 Mo de moins que le variant 4bit, pour une quantification équivalente. Non téléchargé : c'est le variant 4bit qui a été mesuré."
      - "Le pic suit `max_frames`, pas la durée de la vidéo : huit images d'un plan de dix minutes coûtent autant que huit images de dix secondes."
      - "Le raisonnement à voix haute est coupé par l'adaptateur (`options.thinking: false`), qui transmet `enable_thinking` au gabarit. Le rallumer change ce que la capacité mesure."
      - "Le chemin vidéo natif de mlx-vlm est inutilisable avec les poids du titulaire ; son comportement avec ceux-ci n'a pas été éprouvé."
      - "Poids partagés avec qwen36-27b-describe, -ocr et -detect — les déporter déplace les quatre."
  - id: 4bit
    quantization: 4bit
    tier: hot
    runtime: mlx-vlm
    source:
      kind: huggingface
      repo: mlx-community/Qwen3.6-27B-4bit
      revision: "c000ac2c2057d94be3fa931000c31723aac53282"   # 2026-04-22
      allow_patterns: ["*.json", "*.safetensors", "*.txt", "*.jinja"]
    defaults:
      fps: 1.0
      max_frames: 8
      max_tokens: 512
      temperature: 0.2
    caveats:
      - "MESURÉ : cette capacité échoue sur cette machine. Le banc rend « [METAL] Command buffer execution failed: Insufficient Memory » sur les trois cas de la charge type. Les poids chargés occupent déjà 14,95 Gio ; le buffer que réclame l'encodage de l'image ne passe plus. `--hors-budget` n'y change rien — il lève un refus d'admission, pas un refus de Metal, et l'allocation échoue en aval du contrôle."
      - "Le raisonnement à voix haute est coupé par l'adaptateur (`options.thinking: false`), qui transmet `enable_thinking` au gabarit. Le rallumer change ce que la capacité mesure."
