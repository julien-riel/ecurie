# Appel d'outils — septième et dernier emploi des mêmes poids.
#
# Cette capacité a demandé plus qu'un aiguillage à la génération précédente.
# Qwen3.6 ne rend pas ses appels en JSON balisé comme Qwen3, mais en XML
# imbriqué :
#
#     <tool_call><function=météo><parameter=ville>Paris</parameter></function></tool_call>
#
# L'extracteur de `mlx_lm_tools` capturait bien la balise, tentait un
# `json.loads` sur son contenu, échouait, et rendait zéro appel — sur un modèle
# qui avait choisi le bon outil et rempli le bon argument. Il a gagné une
# stratégie `xml_function`, et la métrique `parse_strategy` du job dit désormais
# lequel des trois formats a servi. Qwen3.8 partage le gabarit de chat de la
# 3.6 ; il devrait rendre `xml_function` lui aussi, et cette métrique est la
# première chose à lire dans le relevé.
#
# Écurie n'exécute aucun outil : elle juge le choix et le remplissage.
id: qwen38-27b-outils
name: Qwen3.8 27B (appel d'outils)
capability: tool-use
family: qwen3.8
vendor: Alibaba Qwen
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Challenger de qwen3-4b-outils. La fiche amont place l'exécution agentique en
  tête de ses gains — planification autonome, meilleure prise en compte du retour
  de l'environnement —, ce qui fait de cette capacité celle où un écart avec le
  titulaire est le plus plausible. C'est aussi celle que le contrat du parc teste
  le plus mal : trois outils déclarés, un tour, aucune boucle.

links:
  homepage: https://huggingface.co/Qwen/Qwen3.8-27B

variants:
  - id: mxfp4
    quantization: 4bit
    tier: hot
    runtime: mlx-vlm
