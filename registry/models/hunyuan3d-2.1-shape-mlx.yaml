# Second maillon de ce qui devait être la capacité composite text-to-mesh : le
# contrat n'a jamais été écrit (tâche 7.1) et la filière est coupée depuis le
# 2026-08-29. Seul image-to-mesh existe comme contrat.
id: hunyuan3d-2.1-shape-mlx
name: Hunyuan3D 2.1 Shape (MLX)
capability: image-to-mesh
family: hunyuan3d
vendor: Tencent
license: tencent-hunyuan-community
license_class: restricted     # restrictions géographiques et de seuil d'usage — à lire avant tout usage pro
# `candidate`, et non `active` : sur les 72 manifestes, les deux seuls `active`
# étaient les deux titulaires, et le statut de titulaire a été retiré ici le
# 2026-08-29 (décision 8). Dans ce dépôt, `candidate` ne veut pas dire « ne marche
# pas » — CONCEPTION.md l'écrit des trois modèles du parc réel : « ils fonctionnent
# et sont mesurés, mais rien ne dit encore qu'ils sont les bons ». C'est l'état
# exact : trois cas de banc rendus le 2026-08-24, aucune comparaison qui promeuve.
# `retired` serait faux — le schéma en fait « poids supprimés du disque », et les
# 7,37 Go sont là.
status: candidate

notes: >
  Géométrie de bonne tenue sur Apple Silicon. Le pipeline PBR complet n'est pas couvert :
  prévoir une passe de texturation séparée. Alternative TRELLIS.2 (MIT, meilleure sur le
  papier) bloquée par ses noyaux CUDA — voir candidate trellis2.

variants:
  - id: mlx-bf16
    quantization: bf16
    tier: hot
    runtime: custom
    runtime_env: hunyuan3d
    entrypoint: runtimes/hunyuan3d/run.py
    source:
      kind: huggingface
      repo: tencent/Hunyuan3D-2.1
      revision: "0b94677654c57bb9a6b6845cd7b704ccf551d327"   # 2025-10-17
      # Le dépôt sert deux pipelines ; celui-ci ne veut que la forme. Le seul
      # model.fp16.ckpt de hunyuan3d-dit-v2-1/ contient déjà DiT, ShapeVAE et
      # conditionneur DINOv2 — le dossier hunyuan3d-vae-v2-1/ autonome (0,66 Go)
      # ne sert qu'à la démo d'encodage de maillage, et hunyuan3d-paintpbr-v2-1/
      # (6,89 Go) à la texturation. Filtrer épargne 7,54 Go sur 14,91 Go.
      # LICENSE et Notice.txt suivent les poids (34 ko) : la licence impose de
      # transmettre le Notice, autant l'avoir sous la main à côté du modèle.
      allow_patterns: ["hunyuan3d-dit-v2-1/*", "LICENSE", "Notice.txt"]
    defaults:
      octree_resolution: 256
      num_inference_steps: 30
    caveats:
      - "Géométrie seulement, pas de PBR complet."
      - "Licence à restrictions : vérifier avant tout usage professionnel."
      - "Le suffixe « mlx » de l'id est trompeur : aucun portage MLX de la partie shape 2.1 n'est publié (le portage communautaire s'arrête à 2.0/2mini). L'inférence passe par PyTorch/MPS — chemin éprouvé au banc du 2026-08-24, sur cette machine et cette révision de poids seulement."
      - "Hors promesse v1 : filière 3D coupée le 2026-08-29 (décision 8), statut de titulaire retiré, statut ramené à candidate. Le manifeste reste au registre : découvrable et exécutable, sans engagement d'entretien ni garantie que le profil reste à jour."
    profile:
      disk_bytes: 7366426405
      peak_unified_memory_bytes: 17693065216
      warmup_ms: 44707
      latency_ms_p50: 372803
      throughput: "1 sortie / 494.0 s"
      measured_on: "Mac17,4 24 Gio / macOS 26.5.2"
      measured_at: "2026-08-24"
      harness_version: "0.3.0"
