# Second maillon de la capacité composite text-to-mesh.
id: hunyuan3d-2.1-shape-mlx
name: Hunyuan3D 2.1 Shape (MLX)
capability: image-to-mesh
family: hunyuan3d
vendor: Tencent
license: tencent-hunyuan-community
license_class: restricted     # restrictions géographiques et de seuil d'usage — à lire avant tout usage pro
status: active
incumbent: true

notes: >
  Géométrie de bonne tenue sur Apple Silicon. Le pipeline PBR complet n'est pas couvert :
  prévoir une passe de texturation séparée. Alternative TRELLIS.2 (MIT, meilleure sur le
  papier) bloquée par ses noyaux CUDA — voir candidate trellis2.

variants:
  - id: mlx-bf16
    quantization: bf16
    tier: hot
    runtime: custom
    runtime_env: hunyuan3d
    entrypoint: runtimes/hunyuan3d/run.py
    source:
      kind: huggingface
      repo: tencent/Hunyuan3D-2.1
      revision: "0b94677654c57bb9a6b6845cd7b704ccf551d327"   # 2025-10-17
      # Le dépôt sert deux pipelines ; celui-ci ne veut que la forme. Le seul
      # model.fp16.ckpt de hunyuan3d-dit-v2-1/ contient déjà DiT, ShapeVAE et
      # conditionneur DINOv2 — le dossier hunyuan3d-vae-v2-1/ autonome (0,66 Go)
      # ne sert qu'à la démo d'encodage de maillage, et hunyuan3d-paintpbr-v2-1/
      # (6,89 Go) à la texturation. Filtrer épargne 7,54 Go sur 14,91 Go.
      # LICENSE et Notice.txt suivent les poids (34 ko) : la licence impose de
      # transmettre le Notice, autant l'avoir sous la main à côté du modèle.
      allow_patterns: ["hunyuan3d-dit-v2-1/*", "LICENSE", "Notice.txt"]
    defaults:
      octree_resolution: 256
      num_inference_steps: 30
    caveats:
      - "Géométrie seulement, pas de PBR complet."
      - "Licence à restrictions : vérifier avant tout usage professionnel."
      - "Le suffixe « mlx » de l'id est trompeur : aucun portage MLX de la partie shape 2.1 n'est publié (le portage communautaire s'arrête à 2.0/2mini). L'inférence passe par PyTorch/MPS, chemin non validé de bout en bout."
    profile:
      disk_bytes: 7366426405
      peak_unified_memory_bytes: 17693065216
      warmup_ms: 44707
      latency_ms_p50: 372803
      throughput: "1 sortie / 494.0 s"
      measured_on: "Mac17,4 24 Gio / macOS 26.5.2"
      measured_at: "2026-08-24"
      harness_version: "0.3.0"
