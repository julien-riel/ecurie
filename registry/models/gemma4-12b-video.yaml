# Gemma 4 12B — description de vidéo. Voir gemma4-12b-texte.yaml pour l'en-tête
# de la famille.
#
# La fiche amont pose une borne que le contrat ne connaît pas : l'analyse vidéo
# est donnée pour des séquences d'au plus **60 secondes**. Ce n'est pas une
# limite que l'adaptateur applique — il échantillonne des images fixes, et une
# vidéo de dix minutes lui en donne autant qu'une de dix secondes. La borne
# porte donc sur ce que la réponse vaut, pas sur ce que le job accepte : au-delà,
# le modèle répondra quand même, et sa réponse n'a pas été garantie par qui l'a
# entraîné.
id: gemma4-12b-video
name: Gemma 4 12B Instruct (description de vidéo)
capability: video-to-text
family: gemma4
vendor: Google
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Challenger de qwen3-vl-8b-video. Sur le titulaire, le chemin vidéo natif de
  mlx-vlm s'est révélé inutilisable — il transmettait un unique jeton de
  remplissage, et le modèle décrivait alors une scène figée en niant tout
  mouvement. L'adaptateur décode donc lui-même. Rien ne dit que cette famille se
  comporte pareil, et la sortie `native_video` du job dira quel chemin a servi.

links:
  homepage: https://huggingface.co/google/gemma-4-12B-it

