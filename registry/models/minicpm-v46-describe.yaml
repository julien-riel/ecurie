# MiniCPM-V 4.6 — le plus léger VLM du parc, et de loin.
#
# 2,18 Go en 4 bits. Le titulaire de cette capacité, qwen3-vl-8b-describe, en
# pèse 5,78 ; le candidat Gemma 4 12B, 6,77. Celui-ci tient dans le quart du
# budget et sous le seuil de lourdeur avec une marge telle qu'il ne compte
# presque pas dans la politique de résidence — deux modèles comme lui
# cohabiteraient sans peine.
#
# C'est ce qui en fait autre chose qu'un challenger de plus : à cette taille, un
# VLM cesse d'être un modèle qu'on charge pour devenir un modèle qu'on laisse
# chargé. Reste à savoir ce qu'il rend, et le golden set seul le dira — 1,3
# milliard de paramètres n'ont pas la même mémoire du monde que huit.
#
# Servi par mlx-vlm, qui porte l'architecture `minicpmv4_6`. Aucun runtime à
# créer, aucun adaptateur à écrire : les workers vision du parc le prennent tel
# quel.
id: minicpm-v46-describe
name: MiniCPM-V 4.6 (description d'image)
capability: image-to-text
family: minicpm-v
vendor: OpenBMB
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Demandé nommément en GGUF. Le parc n'a pas de runtime GGUF — `llama-cpp` est
  déclaré hors périmètre dans `envs.NOT_YET`, faute de quoi il faudrait passer
  par Ollama ou LM Studio, donc par un serveur tiers que le superviseur ne
  contrôle pas. La conversion MLX rend le même service sans cette dépendance :
  mêmes poids d'origine, quantification équivalente, et un chemin d'exécution
  que le parc sait déjà emprunter.

links:
  homepage: https://huggingface.co/openbmb/MiniCPM-V-4.6

variants:
  - id: 4bit
    quantization: 4bit
    tier: hot
    runtime: mlx-vlm
    source:
      kind: huggingface
      repo: mlx-community/MiniCPM-V-4.6-4bit
      revision: "86cd463d33a946e4481b77e3c10fc63121b60a19"   # 2026-05-13
      allow_patterns: ["*.json", "*.safetensors", "*.txt", "*.jinja"]
    defaults:
      detail: normal
      max_tokens: 512
      temperature: 0.2
    options:
      thinking: false
    caveats:
      - "2,65 Gio de pic et 1,3 s par sortie : le VLM le plus léger et le plus rapide du parc. Le titulaire qwen3-vl-8b-describe pique à 6,60 Gio et répond en 6,6 s ; Gemma 4 12B à 6,81 Gio et 5,3 s."
      - "1,3 milliard de paramètres en 4 bits : c'est le plus petit VLM du parc, et l'écart de taille avec les titulaires est tel qu'il faut s'attendre à le payer quelque part — le texte incrusté, le comptage, les détails fins sont les premiers postes à regarder."
      - "OBSERVÉ — LE FRANÇAIS EST FAUTIF. Sur la scène du banc, le contenu est juste (les trois formes, leurs positions, la lumière) mais la langue ne l'est pas : « un sphere », « un cone », « sur le gauche ». Le modèle voit bien et écrit mal. Sur une capacité dont la sortie est du texte destiné à être lu, cela compte autant que l'exactitude — et le golden set le notera comme tel."
      - "Poids partagés avec les autres manifestes minicpm-v46 — les déporter avec `ecurie store tier` les déplace tous."
    profile:
      disk_bytes: 2177910526
      peak_unified_memory_bytes: 2840772480
      warmup_ms: 1472
      latency_ms_p50: 1222
      throughput: "1 sortie / 1.3 s"
      measured_on: "Mac17,4 24 Gio / macOS 26.5.2 / mlx 0.32.1 / mlx-vlm 0.6.15"
      measured_at: "2026-08-23"
      harness_version: "0.3.0"
