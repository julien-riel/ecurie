# Gemma 4 12B — appel d'outils. Voir gemma4-12b-texte.yaml pour l'en-tête de la
# famille.
#
# La fiche amont annonce un « native support for structured tool use », et le
# gabarit de conversation le confirme : il accepte `tools` et sait rendre des
# `tool_call`. La métrique `template_tools` du job doit donc rester vraie — si
# elle passe à faux, l'appel a été demandé par consigne système et ne mesure plus
# la même chose.
#
# Le format d'appel de Gemma n'est pas celui de Qwen3.6, qui a valu à
# l'extracteur sa stratégie XML. Lequel des trois formats a servi se lit dans la
# métrique `parse_strategy`, et c'est précisément pour ce genre de découverte
# qu'elle est rapportée à chaque exécution.
id: gemma4-12b-outils
name: Gemma 4 12B Instruct (appel d'outils)
capability: tool-use
family: gemma4
vendor: Google
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Écurie n'exécute aucun outil : elle juge le choix et le remplissage. Ce
  manifeste sert à mesurer une compétence, pas à brancher un agent — la boucle
  d'agent reste hors périmètre (ARCHITECTURE.md §11).

links:
  homepage: https://huggingface.co/google/gemma-4-12B-it

variants:
  - id: 4bit
    quantization: 4bit
    tier: hot
    runtime: mlx-vlm
    source:
      kind: huggingface
      repo: mlx-community/gemma-4-12B-it-4bit
      revision: "73bcf09092aa277861d5a191b989b666f7f32e8f"   # 2026-06-08
      allow_patterns: ["*.json", "*.safetensors", "*.txt", "*.jinja"]
    defaults:
      tool_choice: auto
      parallel_calls: false
      temperature: 0.0
    options:
      thinking: false
    caveats:
      - "7,15 Gio de pic, 2,3 s par sortie, et un appel juste sur les trois cas de la charge type — 3, 8 et 16 outils déclarés, aucun reproche sur les arguments."
      - "Appel natif confirmé : `template_tools` rend vrai, donc les outils passent par le gabarit et non par une consigne système. Il a fallu les lui déclarer au format enveloppé — le gabarit lit `tool.function.name` et lève sur la forme plate que Qwen3 accepte."
      - "Format d'appel propre à cette famille : `parse_strategy` doit rendre `gemma_tool_call`. Si elle rend `aucun`, c'est l'extracteur qu'il faut regarder avant d'accuser le modèle."
      - "Poids partagés avec les six autres manifestes gemma4-12b — les déporter déplace les sept."
    profile:
      disk_bytes: 6773371194
      peak_unified_memory_bytes: 7677838752
      warmup_ms: 1838
      latency_ms_p50: 2153
      throughput: "1 sortie / 2.3 s"
      measured_on: "Mac17,4 24 Gio / macOS 26.5.2 / mlx 0.32.1 / mlx-vlm 0.6.15"
      measured_at: "2026-08-23"
      harness_version: "0.3.0"
