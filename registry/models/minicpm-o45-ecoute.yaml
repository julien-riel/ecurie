# MiniCPM-o 4.5 — l'écoute, et la raison d'être de ce modèle dans le parc.
#
# Les mêmes poids que `minicpm-o45-describe`, autre contrat, autre modalité.
# C'est le premier manifeste du registre dont le modèle **voit et entend sans
# être rechargé** : jusqu'ici, décrire une image supposait qwen3-vl-8b, écouter
# un son supposait qwen2-audio-7b, et la politique du parc — un seul modèle
# lourd résident — obligeait à décharger le premier pour interroger le second.
#
# Le gain n'est donc pas de qualité mais de mémoire, et il est concret : sur une
# machine à 17,76 Gio de budget, deux modèles de 6 à 7 Gio ne cohabitent pas
# confortablement, un seul si.
#
# Il a fallu un adaptateur : `mlx_vlm_audio`. `audio-to-text` était servi par
# `mlx-audio` uniquement, et le couple `(mlx-vlm, audio-to-text)` n'existait pas
# — le parc voyait un modèle qui sait écouter et n'avait aucun moyen de le lui
# demander. C'est le même empêchement que celui levé pour les capacités texte de
# Qwen3.6, et la même réponse : le moteur change, le contrat non.
id: minicpm-o45-ecoute
name: MiniCPM-o 4.5 (écoute)
capability: audio-to-text
family: minicpm-o
vendor: OpenBMB
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Challenger de qwen2-audio-7b, titulaire de fait de cette capacité (6,57 Go sur
  le disque, 7,57 Gio de pic). À 6,16 Go, ce candidat coûte un peu moins et
  apporte la vision par-dessus. Ce qu'il vaut à l'écoute reste entier à
  établir : le golden set de la capacité n'a pas tourné, et décrire un son n'est
  pas le transcrire — c'est la consigne qui tranche, faute de quoi ces réseaux
  retombent sur leur défaut d'usine, qui est de transcrire.

  L'encodeur audio est un `whisper`, ce qui situe la famille sans rien promettre
  sur la qualité après quantification à 4 bits.

links:
  homepage: https://huggingface.co/openbmb/MiniCPM-o-4_5

variants:
  - id: 4bit
    quantization: 4bit
    tier: hot
    runtime: mlx-vlm
    source:
      kind: huggingface
      repo: mlx-community/MiniCPM-o-4_5-4bit
      revision: "592c09d85e7bffbc8f8e45a417aa8e9a96119814"   # 2026-03-05
      allow_patterns: ["*.json", "*.safetensors", "*.txt", "*.jinja"]
    defaults:
      max_tokens: 512
      temperature: 0.2
    options:
      thinking: false
    caveats:
      - "MESURÉ — IL SE CHARGE, IL N'ÉCOUTE PAS. Le correctif `minicpm_compat` a levé le refus de chargement, et la tour audio est bien construite (367 tenseurs). L'audio parvient au modèle — le gabarit porte son jeton, vérifié. Mais la sortie est inexploitable : « <unk><|tts_eos|> » sur une demande de transcription, et une boucle dégénérée sur une demande de description (« un chien abattant son chien », répété). La cause est en aval du chargement — préparation du signal, ou encodeur audio abîmé par la quantification à 4 bits. Le variant reste au registre pour porter ce constat, pas pour être employé."
      - "LE 5 BITS A ÉTÉ ESSAYÉ, ET IL NE SUFFIT PAS. Il est meilleur — là où le 4 bits parlait de chiens, il répond « c'est un son de synthèse », ce qui est **exact** : la charge est un enregistrement de TTS. L'encodeur audio fonctionne donc en partie, il perçoit la nature du son. Mais il ne transcrit pas, et la description part en boucle (« des sons de sons de synthèses », répété jusqu'au plafond de jetons). La quantification n'est donc pas la seule cause, et un cran de plus ne réglera pas cela."
      - "Ce qui reste à écarter : le modèle amont en Torch (20,05 Go), seul moyen de savoir si le défaut est dans la conversion MLX ou dans le préprocessing audio de mlx-vlm. Non téléchargé — c'est une vérification, pas un besoin, et elle demanderait un runtime que le parc n'a pas."
      - "`listened_seconds` n'est renseigné que pour un WAV, dont l'en-tête donne la durée sans décoder. Pour les autres conteneurs la sortie est absente plutôt qu'inventée : le contrat déclare la durée écoutée, pas la durée devinée."
      - "Le contrat expose `max_seconds`, que cet adaptateur ne peut pas honorer : le son est décodé par le processeur du runtime, pas par le worker, qui n'a donc pas la main pour tronquer. Un enregistrement plus long que la fenêtre du modèle sera coupé par le modèle, sans que rien ne le dise."
      - "Poids partagés avec minicpm-o45-describe — les déporter avec `ecurie store tier` déplace les deux."
