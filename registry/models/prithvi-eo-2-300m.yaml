      measured_on: "Mac17,4 24 Gio / macOS 26.5.2 / rasterio 1.5.1 / terratorch 1.2.11 / torch 2.13.0 / torchgeo 0.9.0"
      measured_at: "2026-08-24"
      harness_version: "0.3.0"
