# Détection d'objets — les MÊMES poids que qwen3-vl-8b-ocr, -describe et -video.
#
# Quatrième manifeste sur un seul dépôt. Les trois premiers rendaient du texte ;
# celui-ci rend une structure, et c'est ce qui justifie un adaptateur de plus :
# convertir les coordonnées du modèle en pixels de l'image, écarter les boîtes
# mal formées sans perdre le job, et tracer de quoi vérifier à l'œil.
id: qwen3-vl-8b-detect
name: Qwen3-VL 8B Instruct (détection d'objets)
capability: image-detect
family: qwen3-vl
vendor: Alibaba Qwen
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  La convention de coordonnées a été mesurée avant d'écrire une ligne
  d'adaptateur, sur une scène dont les positions sont connues par fabrication :
  le modèle raisonne sur une grille 0–1000, et non en pixels. Une boîte rendue
  y dépassait 768 sur une image de 768 pixels, ce qui suffit à trancher. Cette
  convention appartient à la famille de modèles, pas au contrat : c'est
  l'adaptateur qui convertit, et le contrat promet des pixels.

  La conversion est vérifiée contre une vérité exacte, et c'est rare pour une
  capacité générative : la scène du banc est composée par une recette, donc on
  connaît le centre de chaque objet au pixel près. Mesuré — cube (209, 460)
  contre (215, 461) attendu, sphère (418, 506) contre (422, 507), cône
  (595, 486) contre (599, 476). Moins de dix pixels d'écart sur 768.

