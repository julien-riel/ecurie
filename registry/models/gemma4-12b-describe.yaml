# Gemma 4 12B — description d'image. Voir gemma4-12b-texte.yaml pour l'en-tête
# de la famille.
#
# Architecture encodeur-libre : l'image n'est pas encodée par une tour séparée
# puis projetée, elle entre directement dans l'espace du modèle de langue. La
# fiche amont en tire une propriété qui compte pour cette capacité — les images
# sont acceptées « à des rapports d'aspect et des résolutions variables », là où
# les VLM à tour de vision redimensionnent vers une grille de tuiles fixe.
# Reste à voir ce que ça donne sur le golden set : c'est une promesse de fiche,
# pas une mesure.
id: gemma4-12b-describe
name: Gemma 4 12B Instruct (description d'image)
capability: image-to-text
family: gemma4
vendor: Google
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Challenger de qwen3-vl-8b-describe, titulaire de fait. Les deux tiennent dans
  le budget, ce qui rend la comparaison honnête : ni l'un ni l'autre n'a besoin
  de vider le parc pour répondre, et le golden set départagera sur la qualité
  seule.

links:
  homepage: https://huggingface.co/google/gemma-4-12B-it

