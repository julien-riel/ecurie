# Compréhension audio — Qwen2-Audio, sur le runtime mlx-audio déjà là.
#
# `mlx_audio/stt/models/qwen2_audio/` est présent dans le venv installé, et sa
# fonction `generate` accepte une consigne libre : c'est ce qui sépare cette
# capacité de la transcription, dont le défaut d'usine du même modèle est
# « Please transcribe the speech ».
id: qwen2-audio-7b
name: Qwen2-Audio 7B Instruct
capability: audio-to-text
family: qwen2-audio
vendor: Alibaba Qwen
license: apache-2.0
license_class: permissive
status: candidate

notes: >
  Attention à la politique des lourds : le pic attendu approche les huit
  gigaoctets, au-dessus du seuil de lourdeur de huit Gio une fois mesuré. Ce
  variant occupera donc la place unique du parc, comme la synthèse vocale — deux
  modèles lourds ne cohabitent pas.

links:
  homepage: https://huggingface.co/mlx-community/Qwen2-Audio-7B-Instruct-4bit

variants:
  - id: 4bit
    quantization: 4bit
    tier: hot
    runtime: mlx-audio
    source:
      kind: huggingface
      repo: mlx-community/Qwen2-Audio-7B-Instruct-4bit
      revision: "c65570002626f41b4dc08b7b54f42f99f3e82e7f"   # 2026-03-29
      allow_patterns: ["*.json", "*.safetensors", "*.txt"]
    defaults:
      max_seconds: 120
      max_tokens: 512
      temperature: 0.2
    caveats:
      - "La mémoire suit la durée écoutée en théorie ; sur vingt secondes elle ne bouge pas d'un octet — pente mesurée nulle entre 5 et 20 s. La borne reste utile pour des durées d'un autre ordre, mais le pic de ce variant est celui du modèle, pas de l'audio."
      - "Ce variant invente : sur un wav de synthèse vocale française, il décrit « une chanson pop rock avec une voix féminine et des accords en F# major ». La capacité fait ce qu'elle promet — décrire plutôt que transcrire — mais la description n'est pas fiable sur des sons qui ne ressemblent pas à ses données. C'est le golden set du v0.5 qui le chiffrera."
      - "7,57 Gio de pic : sous le seuil de lourdeur de 8 Gio, donc ce variant peut cohabiter avec un autre modèle léger — ce que le manifeste annonçait comme improbable avant mesure."
    profile:
      disk_bytes: 6574656756
      peak_unified_memory_bytes: 7565610510
      warmup_ms: 956
      latency_ms_p50: 3375
      throughput: "1 sortie / 3.4 s"
      measured_on: "Mac17,4 24 Gio / macOS 26.5.2 / mlx 0.32.1"
      measured_at: "2026-08-22"
      harness_version: "0.3.0"
