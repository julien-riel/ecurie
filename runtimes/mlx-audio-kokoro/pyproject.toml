# Environnement isolé du runtime `mlx-audio`, chemin **Kokoro**.
#
# Pourquoi un env de plus pour la même bibliothèque : Kokoro passe par `misaki`,
# dont la 0.9.4 exige Python < 3.13, alors que `runtimes/mlx-audio/` tourne en
# 3.13 et porte des profils mesurés qu'on ne veut pas invalider. Même runtime,
# même adaptateur, environnement distinct : c'est l'usage que `runtime_env`
# prévoit, déjà pris par `mlx-audio-music`.
#
#     ecurie env sync mlx-audio-kokoro
#
# Le `.venv` n'est pas versionné, ce fichier l'est.

[project]
name = "ecurie-runtime-mlx-audio-kokoro"
version = "0.1.0"
description = "Écurie — environnement isolé du runtime mlx-audio, synthèse Kokoro"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Les mêmes versions que `runtimes/mlx-audio/` : un écart ici rendrait la
    # comparaison entre moteurs ambiguë.
    "mlx-audio==0.5.0",
    "mlx==0.32.1",
    # `misaki[en]` n'est pas pris tel quel : son extra ajoute
    # `spacy-curated-transformers`, qui ne sert qu'à `G2P(trf=True)`, et l'adaptateur
    # reste sur `trf=False`.
    "misaki==0.9.4",
    "num2words>=0.5",
    "spacy>=3.8,<3.9",
    # Le worker est hors ligne : sans ce paquet, misaki tenterait de télécharger
    # le modèle spaCy au premier job.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # Repli pour les mots hors lexique. espeak-ng est sous GPLv3 : il reste dans
    # cet env isolé, et Écurie ne le redistribue pas.
    "phonemizer-fork>=3.3",
    "espeakng-loader>=0.2",
]

# Cet env n'est pas une bibliothèque : rien à construire, rien à installer de lui-même.
[tool.uv]
package = false
