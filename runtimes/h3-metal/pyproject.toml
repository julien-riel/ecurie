# Environnement isolé du runtime `h3-metal` — MiniMax-H3 sur Apple Silicon
# (CONCEPTION.md §5.3).
#
# C'est le premier environnement du parc qui n'installe RIEN, et ce n'est pas un
# oubli. L'inférence de ce modèle ne passe par aucune bibliothèque Python : elle
# est faite par `h3`, un binaire C + Metal construit par `make`, que `run.py` se
# contente de lancer et d'écouter. Le seul code Python en jeu est l'adaptateur
# lui-même, qui n'utilise que la bibliothèque standard et
# `ecurie_runtime.workers.base` — lequel est rendu visible par PYTHONPATH, pas
# installé.
#
# Ce que `ecurie env sync h3-metal` fabrique est donc un interpréteur nu. Ce
# qu'il ne fabrique pas, et que le README détaille : le vendoring de `h3.c` et
# son `make`. FFmpeg et FFprobe doivent en outre être sur le PATH — le binaire
# les appelle pour assembler le MP4, et l'adaptateur pour l'inspecter.

[project]
name = "ecurie-runtime-h3-metal"
version = "0.1.0"
description = "Environnement isolé : MiniMax-H3 (texte vers vidéo sonorisée) via le binaire h3.c en C + Metal"
requires-python = ">=3.11"

# Volontairement vide. Voir l'en-tête : il n'y a pas de dépendance Python à
# installer, et en ajouter une masquerait le fait que ce runtime est un binaire.
dependencies = []

# Sans cette section, `uv` remonte l'arborescence, trouve le workspace de la
# racine du dépôt, constate que cet environnement n'en est pas membre et refuse
# de le synchroniser. Un environnement de runtime est volontairement hors
# workspace : c'est toute la raison d'être de l'isolation (ARCHITECTURE.md §5).
[tool.uv.workspace]
members = []

[tool.uv]
package = false
