# Environnement isolé du runtime `terratorch` (CONCEPTION.md §5.3).
#
# Treizième famille du parc, et la première dont l'entrée n'est pas une image :
# une scène satellite porte six bandes que `image/png` ne sait pas transporter.
# Deux capacités s'y appuient — `geo-segment` et `geo-embed` — sur le même
# encodeur Prithvi-EO-2.0.
#
# **Pourquoi il est isolé.** Trois env portent déjà PyTorch, et aucun ne peut
# accueillir celui-ci sans qu'un modèle déjà mesuré y perde quelque chose :
#
#   depth-anything   impose `numpy<2` pour Depth-Anything-3, quand la résolution
#                    de terratorch rend numpy 2.5. Y entrer rétrograderait numpy
#                    pour tout l'env, ou refuserait de résoudre.
#   torch-vision     porte BiRefNet, Swin2SR, SAM 2, DINOv2 et DINOv3, tous
#                    profilés, et ne borne ni `timm` ni `lightning`. terratorch
#                    épingle `timm` et tire lightning, torchgeo, geopandas,
#                    rasterio, tensorboard et diffusers — cent douze paquets
#                    mesurés, 1,5 Gio sur disque. Cinq profils remis en jeu pour
#                    une capacité de plus est exactement l'arbitrage que
#                    l'isolation existe pour ne plus avoir à faire
#                    (ARCHITECTURE.md §0, piège 2).
#   mflux            n'a ni rasterio ni GDAL, et son unique modèle est un
#                    agrandisseur.
#
#     ecurie env sync terratorch
#
# **La borne sur torchgeo est éliminatoire, et elle a été reproduite.** Sans
# elle, `uv` résout torchgeo 0.10.0 et `import terratorch` échoue :
#
#     ImportError: cannot import name 'utils' from 'torchgeo.trainers'
#
# levée à `terratorch/models/timm_model_factory.py:12`, atteinte par
# `terratorch/__init__.py:9 -> models/__init__.py:18`. La cause se lit dans les
# sdists : torchgeo 0.9.0 contient `trainers/utils.py`, 0.10.0 a réduit
# `trainers/` à un `__init__.py` d'alias dépréciés qui n'exporte plus de
# sous-module `utils`. torchgeo 0.10.0 est sorti deux jours après terratorch
# 1.2.11, qui ne pouvait pas le connaître. L'épingle vaut jusqu'à ce que l'amont
# répare son import — pas une prudence de dépôt, une panne au démarrage.
#
# **Aucune compilation, aucun CUDA, aucun mmcv.** `mmcv`, `openmim`, `ftfy` et
# `regex` n'apparaissent chez terratorch que sous l'extra `mmseg`, jamais en
# dépendance de base : la segmentation passe ici par les décodeurs natifs du
# paquet. rasterio 1.5.1 publie ses roues `macosx_14_0_arm64` pour cp312 à
# cp315, GDAL 3.12.4 arrive dedans, et rien ne se construit à l'installation.
#
# **Cet env tourne sur MPS, avec une contrainte de taille qui lui est propre.**
# Le PPM d'UperNet appelle `adaptive_avg_pool2d` vers (1, 2, 3, 6) sur une carte
# réduite d'un facteur 32 puis 2 ; MPS refuse une division non entière —
# « Adaptive pool MPS: input sizes must be divisible by output sizes ». Le côté
# doit donc être un multiple de 192 : 384, 576, 768 et 960 passent ; 224, 256,
# 480 et 512 échouent. `PYTORCH_ENABLE_MPS_FALLBACK=1` n'y change rien, l'erreur
# venant du noyau Metal et non du dispatch. C'est l'adaptateur qui rembourre, et
# la charge type du banc qui en tient compte.

[project]
name = "ecurie-runtime-terratorch"
version = "0.4.0"
description = "Écurie — env isolé : imagerie satellite multi-bandes (segmentation et encodage) sur PyTorch/MPS"
# Aligné sur le socle 3.12 d'Écurie : le worker exécute
# `ecurie_runtime.workers.base`, écrit pour cette version.
requires-python = ">=3.12"

dependencies = [
    # La bibliothèque d'amont, apache-2.0 comme les poids. Elle apporte
    # `EncoderDecoderFactory`, qui est le seul chemin par lequel on peut
    # construire le fine-tune Sen1Floods11 **sans** que son `config.yaml` aille
    # chercher 1,33 Go de backbone sur le réseau.
    "terratorch>=1.2.11,<1.3",
    # BORNE ÉLIMINATOIRE — voir l'en-tête. Sans elle, `import terratorch` échoue
    # à l'installation suivante, et pas à l'exécution suivante.
    "torchgeo==0.9.0",
    # Même borne que les quatre autres env torch du parc, et pour la même
    # raison : les roues macOS arm64 passent de `macosx_11_0` à `macosx_14_0`
    # en 2.12, donc `torch>=2.12` imposerait macOS 14 à tout le parc.
    "torch>=2.6,<2.14",
    "torchvision",
    # Déclarées par l'amont, redites ici parce que l'adaptateur les importe
    # directement : c'est lui qui ouvre le GeoTIFF, sélectionne les six bandes,
    # normalise, rembourre au multiple de 192 puis recadre le masque et le
    # réécrit avec le CRS et la transformation affine de l'entrée.
    "rasterio>=1.4,<2",
    "numpy>=2.2",
    # Arrive de toute façon par lightning, redite parce que l'adaptateur de
    # segmentation l'importe : c'est le `config.yaml` publié à côté des poids qui
    # décrit l'assemblage du fine-tune, et le lire est le seul moyen de
    # construire le modèle que ces poids-là remplissent.
    "pyyaml>=6",
    # Le seul usage est l'aperçu PNG du masque, et il n'est pas décoratif : un
    # GeoTIFF de classes ne se regarde pas dans l'UI, et un masque décalé d'une
    # bande ressemble à un masque juste tant qu'on ne le superpose pas.
    "pillow>=10",
]

[tool.uv]
package = false
